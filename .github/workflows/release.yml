name: Validate and release main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize version/tag reservation and publishing. Never cancel an in-flight upload.
concurrency:
  group: geco-release
  cancel-in-progress: false

jobs:
  plan:
    name: Version and immutable tag preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      changelog: ${{ steps.plan.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/release.py plan

  validate:
    name: Validate exact main commit
    needs: plan
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish validated Fabric and NeoForge files
    needs: [plan, validate]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: geco-release-candidate
          path: artifacts
      - name: Require publishing credential
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          test -n "$CURSEFORGE_API_TOKEN" || { echo 'Set repository secret CURSEFORGE_API_TOKEN.' >&2; exit 1; }
      - name: Verify bytes, reserve version, and resume recorded uploads
        id: prepare
        run: python scripts/release.py prepare --directory artifacts
      - name: Publish Fabric
        id: fabric
        if: steps.prepare.outputs.fabric_published != 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: 1296676
          curseforge-token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          files: artifacts/geco-fabric-${{ needs.plan.outputs.version }}.jar
          name: Geco ${{ needs.plan.outputs.version }} - Fabric 1.21.1
          version: ${{ needs.plan.outputs.version }}-fabric-1.21.1
          version-type: release
          changelog-file: ${{ needs.plan.outputs.changelog }}
          loaders: fabric
          game-versions: 1.21.1
          game-version-filter: none
          environment: client | server
          java: '21'
          curseforge-dependencies: |
            419699(required)
            306612(required)
          retry-attempts: 1
          fail-mode: fail
      - name: Record successful Fabric upload
        if: steps.fabric.outcome == 'success'
        env:
          CURSEFORGE_FILE_ID: ${{ steps.fabric.outputs.curseforge-version }}
        run: python scripts/release.py receipt --directory artifacts --loader fabric
      - name: Publish NeoForge
        id: neoforge
        if: steps.prepare.outputs.neoforge_published != 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: 1296676
          curseforge-token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          files: artifacts/geco-neoforge-${{ needs.plan.outputs.version }}.jar
          name: Geco ${{ needs.plan.outputs.version }} - NeoForge 1.21.1
          version: ${{ needs.plan.outputs.version }}-neoforge-1.21.1
          version-type: release
          changelog-file: ${{ needs.plan.outputs.changelog }}
          loaders: neoforge
          game-versions: 1.21.1
          game-version-filter: none
          environment: client | server
          java: '21'
          curseforge-dependencies: 419699(required)
          retry-attempts: 1
          fail-mode: fail
      - name: Record successful NeoForge upload
        if: steps.neoforge.outcome == 'success'
        env:
          CURSEFORGE_FILE_ID: ${{ steps.neoforge.outputs.curseforge-version }}
        run: python scripts/release.py receipt --directory artifacts --loader neoforge
      - name: Publish GitHub release after both CurseForge checkpoints
        run: python scripts/release.py finalize --directory artifacts
